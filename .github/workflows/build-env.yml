name: build-env

# Builds the megh dev-env images and pushes them to GHCR. This is the
# "regenerate and roll" path: change env/base/Dockerfile, push, and the new
# image tag is available for every provider to pull. No box is ever mutated in
# place and snapshotted.
#
# GHCR is a stand-in registry for the "get a feel" phase. The end state moves
# this to the self-hosted Forgejo OCI registry on the always-on box so no third
# party sees the tooling images either. The image contains tools only, never
# source or keys, so GHCR in the interim is a mild constraint-2 compromise, not
# a leak of anything sensitive.

on:
  push:
    branches: [main]
    paths:
      - "env/**"
      - ".github/workflows/build-env.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        flavor: [base]
        # RunPod CPU pods are x86_64. Add arm64 here when a provider needs it;
        # the platform below expands accordingly.
        platform: [linux/amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: env/${{ matrix.flavor }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/megh-${{ matrix.flavor }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/megh-${{ matrix.flavor }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
