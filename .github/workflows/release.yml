name: release

# Publish a megh binary you can fetch from anywhere, which is what makes a phone
# usable as the control device: Termux downloads a static arm64 binary instead of
# carrying a ~500 MB Go toolchain to rebuild on every change.
#
# Every push to main updates ONE rolling prerelease tagged `latest`, rather than
# cutting a version per commit. `gh release download latest` therefore always
# means "current main", which is the thing you want on a phone; versioned
# releases stay a separate, deliberate act (see the release skill).
#
# megh.yaml.example rides along as an asset. The REAL config is private and lives
# in the dotfiles repo, because it names every repo you work on; install.sh
# fetches that separately. Shipping the template still means a fresh machine has
# something to start from without cloning anything.

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "megh.yaml.example"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"   # static, so it runs on Termux/musl/any glibc vintage
        run: |
          set -euo pipefail
          mkdir -p dist
          sha=$(git rev-parse --short HEAD)
          # android/arm64 is the phone. NOT linux/arm64: Go's static linux build
          # is ET_EXEC, and Android's loader only accepts ET_DYN, so Termux
          # rejects it outright with `unexpected e_type: 2`. Building -buildmode=pie
          # for linux fixes the type but asks for /lib/ld-linux-aarch64.so.1,
          # which Android does not have. GOOS=android gets both right: PIE, and an
          # interpreter of /system/bin/linker64. With cgo off it needs no NDK and
          # pulls in no shared libraries at all, only raw syscalls.
          for target in android/arm64 linux/arm64 linux/amd64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}
            GOOS=$os GOARCH=$arch go build \
              -ldflags "-s -w" \
              -o "dist/megh-${os}-${arch}" .
          done
          cp megh.yaml.example dist/megh.yaml.example
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish the rolling `latest` release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          # printf, not a heredoc: a heredoc body would have to sit at column 0,
          # which is less indented than this YAML block scalar and so ends it.
          printf '%s\n' \
            "Rolling build of main @ ${sha}. Updated on every push; not a version." \
            "" \
            "Phone (Termux):" \
            "" \
            "    gh release download latest --repo ${REPO} -p 'megh-android-arm64'" \
            "    mv megh-android-arm64 megh && chmod +x megh" \
            "" \
            "Verify against SHA256SUMS. Versioned releases are cut separately." \
            > notes.md
          # A rolling tag has to be moved, and `gh release create` will not
          # clobber an existing one, so delete and recreate. --cleanup-tag keeps
          # the git tag from drifting away from the release.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/* \
            --title "megh @ ${sha}" \
            --notes-file notes.md \
            --prerelease \
            --target "${GITHUB_SHA}"
