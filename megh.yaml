# megh configuration (checked in).
#
# Holds settings and POINTERS to secrets (env-var names), never secret values.
# Secrets live in the environment (~/personal/envvars). See secrets.env.example.
# Precedence for `megh up`: flag > env var > this file > built-in default.

default_provider: runpod
default_flavor: base
ssh_pubkey_file: ~/.ssh/id_ed25519.pub

registries:
  - name: ghcr
    host: ghcr.io
    namespace: panyam
    username: panyam
    token_env: GH_MEGH_TOKEN        # pointer, not the token

flavors: [base]

providers:
  runpod:
    api_key_env: RUNPOD_API_KEY     # pointer, not the key
    default_dc: US-CA-2
    default_volume: d7znsj0qlh
    vcpu: 2
    ram: 8
    disk: 20

tailscale:
  authkey_env: TS_AUTHKEY           # optional; omit env value for SSH-only

sessions:
  repo: panyam/megh-sessions
  token_env: MEGH_SESSIONS_TOKEN    # pointer; fine-grained PAT, that repo only

# The GitHub identity (profile gh key name) used by repos that don't set one.
default_gh_key: personal

# Your PROJECT repos, cloned into /mnt/work/repos by `megh hydrate` (idempotent).
# A repo authenticates as a GitHub identity from the active profile: its `key`,
# else default_gh_key. That identity's key is forwarded (never stored on the box)
# and used via a per-identity Host alias. megh itself does NOT belong here (the
# CLI runs on your control machine; the box never needs the megh repo).
#
# Two forms:
#   - git@github.com:panyam/foo.git              # uses default_gh_key
#   - {url: git@github.com:inferbook/bar.git, key: inferbook}
repos:
  # ~/newstack (panyam) -> repos/<name>
  - git@github.com:panyam/oneauth.git
  - git@github.com:panyam/mcpkit.git
  - git@github.com:panyam/s3gen.git
  - git@github.com:panyam/templar.git
  - git@github.com:panyam/goutils.git
  - git@github.com:panyam/gocurrent.git
  - git@github.com:panyam/goapplib.git
  - git@github.com:panyam/servicekit.git
  - git@github.com:panyam/tlex.git
  - git@github.com:panyam/toolcop.git
  - git@github.com:panyam/tsutils.git
  - git@github.com:panyam/devloop.git
  - git@github.com:panyam/demokit.git
  - git@github.com:panyam/galore.git
  - git@github.com:panyam/gap-tracker.git
  - git@github.com:panyam/massrelay.git
  - git@github.com:panyam/protoc-gen-dal.git
  - git@github.com:panyam/protoc-gen-go-mcp.git
  - git@github.com:panyam/protoc-gen-go-wasmjs.git

  # ~/projects
  - git@github.com:turnforge/lilbattle.git
  - git@github.com:panyam/notation.git

  # ~/work/hw -> repos/hw/... (mirrors the local nested layout)
  - {url: git@github.com:hwtools/workspace.git, dir: hw}
  - {url: git@github.com:hwtools/research.git,  dir: hw/learnings}
  - {url: git@github.com:hwtools/PranaAI.git,   dir: hw/PranaAI/main}

  # ~/books -> repos/books/<org>/<repo> (org-nested so the two 'book' repos don't collide)
  - {url: git@github.com:mcp-at-scale/mcp-server.git,           dir: books/mcp-at-scale/mcp-server}
  - {url: git@github.com:mcp-at-scale/book.git,                 dir: books/mcp-at-scale/book}
  - {url: git@github.com:mcp-at-scale/flight-booking-agent.git, dir: books/mcp-at-scale/flight-booking-agent}
  - {url: git@github.com:inference-book/inference-plane.git,    dir: books/inference-book/inference-plane}
  - {url: git@github.com:inference-book/book.git,               dir: books/inference-book/book}

# Env vars that must be present on the host. megh blocks `megh up` if any is
# missing, so you catch gaps before launching. box_envs are ALSO copied into the
# box (as pod env) for the repos/services running there. Note: box_envs put those
# values on a third-party VM, list only what the box genuinely needs.
requires:
  envs:
    - RUNPOD_API_KEY
    - GH_MEGH_TOKEN
  box_envs: []
    # - OPENAI_API_KEY
    # - ANTHROPIC_API_KEY

