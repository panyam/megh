# megh configuration (checked in).
#
# Holds settings and POINTERS to secrets (env-var names), never secret values.
# Secrets live in the environment (~/personal/envvars). See secrets.env.example.
# Precedence for `megh up`: flag > env var > this file > built-in default.

default_provider: runpod
default_flavor: slim          # slim = lean, fast pull, code-server installs at boot;
                              # base = full (Playwright + code-server baked), use for frontend work

ssh_pubkey_file: ~/.ssh/id_ed25519.pub

registries:
  - name: ghcr
    host: ghcr.io
    namespace: panyam
    username: panyam
    token_env: GH_MEGH_TOKEN        # pointer, not the token

flavors: [base]

providers:
  runpod:
    api_key_env: RUNPOD_API_KEY     # pointer, not the key
    default_dc: US-CA-2
    default_volume: d7znsj0qlh
    vcpu: 2
    ram: 8
    disk: 20
    # Public break-glass SSH (22/tcp). true today; flip to false once Tailscale
    # SSH is verified to run with ZERO public ports (megh ssh then goes over the
    # tailnet). RunPod console Web Terminal stays the break-glass either way.
    expose_ssh: true

tailscale:
  authkey_env: TS_AUTHKEY           # optional; omit env value for SSH-only

# MagicDNS suffix of your tailnet — used to build box surface URLs in the portal
# (https://<box>.<tailnet>:<port>). Find it in `megh doctor ts status` (Self DNSName).
tailnet: taild311d3.ts.net

# `megh portal`: a bookmarkable box+URL index (PORTAL.md) force-pushed to a branch
# of a private repo, so on mobile you tap a link instead of typing host:port. megh
# up/down refresh it. scheme is http today; switch to https after enabling HTTPS
# certs on the tailnet. Bookmark the rendered PORTAL.md on that branch.
portal:
  repo: git@panyam-github:panyam/megh.git
  branch: portal
  scheme: http

sessions:
  repo: panyam/megh-sessions
  token_env: MEGH_SESSIONS_TOKEN    # pointer; fine-grained PAT, that repo only

# Home dirs symlinked onto the scratch volume so their state survives box
# rebuilds. A one-time `claude login` / `codex login` / etc. on a box persists on
# the volume, so the next box on that volume is already signed in. Add a tool by
# adding its config/auth dir here (and relaunch, or symlink it on the box).
persist:
  - ~/.claude          # Claude Code login + settings
  - ~/.codex           # Codex login + settings
  # - ~/.config/gh     # GitHub CLI auth
  # - ~/.aws           # AWS credentials/config
  # - ~/.config/gcloud # gcloud auth

# The GitHub identity (profile gh key name) used by repos that don't set one.
default_gh_key: personal

# Your PROJECT repos, cloned into /mnt/work/repos by `megh hydrate` (idempotent).
# A repo authenticates as a GitHub identity from the active profile: its `key`,
# else default_gh_key. That identity's key is forwarded (never stored on the box)
# and used via a per-identity Host alias. megh itself does NOT belong here (the
# CLI runs on your control machine; the box never needs the megh repo).
#
# Two forms:
#   - git@github.com:panyam/foo.git              # uses default_gh_key
#   - {url: git@github.com:inferbook/bar.git, key: inferbook}
#
# Layout: repos land under repos/<group>/<name>/<default-branch>, mirroring the
# local ~/<group>/<name>/<branch> worktree convention. The branch leaf is the
# repo's real default branch (main, or master for older repos), hardcoded here.
repos:
  # megh itself, so a box can self-manage / self-hydrate and you can hack on megh
  # from the box (it also carries the live megh.yaml). Kept flat at repos/megh.
  - git@github.com:panyam/megh.git

  # ~/newstack (panyam) -> repos/newstack/<name>/<default-branch>
  - {url: git@github.com:panyam/oneauth.git,              dir: newstack/oneauth/main}
  - {url: git@github.com:panyam/mcpkit.git,               dir: newstack/mcpkit/main}
  - {url: git@github.com:panyam/s3gen.git,                dir: newstack/s3gen/main}
  - {url: git@github.com:panyam/templar.git,              dir: newstack/templar/main}
  - {url: git@github.com:panyam/goutils.git,              dir: newstack/goutils/master}
  - {url: git@github.com:panyam/gocurrent.git,            dir: newstack/gocurrent/main}
  - {url: git@github.com:panyam/goapplib.git,             dir: newstack/goapplib/main}
  - {url: git@github.com:panyam/servicekit.git,           dir: newstack/servicekit/master}
  - {url: git@github.com:panyam/tlex.git,                 dir: newstack/tlex/master}
  - {url: git@github.com:panyam/toolcop.git,              dir: newstack/toolcop/main}
  - {url: git@github.com:panyam/tsutils.git,              dir: newstack/tsutils/master}
  - {url: git@github.com:panyam/devloop.git,              dir: newstack/devloop/main}
  - {url: git@github.com:panyam/demokit.git,              dir: newstack/demokit/main}
  - {url: git@github.com:panyam/galore.git,               dir: newstack/galore/master}
  - {url: git@github.com:panyam/gap-tracker.git,          dir: newstack/gap-tracker/main}
  - {url: git@github.com:panyam/massrelay.git,            dir: newstack/massrelay/main}
  - {url: git@github.com:panyam/protoc-gen-dal.git,       dir: newstack/protoc-gen-dal/main}
  - {url: git@github.com:panyam/protoc-gen-go-mcp.git,    dir: newstack/protoc-gen-go-mcp/main}
  - {url: git@github.com:panyam/protoc-gen-go-wasmjs.git, dir: newstack/protoc-gen-go-wasmjs/main}

  # ~/projects -> repos/projects/<name>/<default-branch>
  - {url: git@github.com:turnforge/lilbattle.git, dir: projects/lilbattle/main}
  - {url: git@github.com:panyam/notation.git,     dir: projects/notation/master}

  # ~/work/hw -> repos/hw/... (mirrors the local nested layout; unchanged)
  - {url: git@github.com:hwtools/workspace.git, dir: hw}
  - {url: git@github.com:hwtools/research.git,  dir: hw/learnings}
  - {url: git@github.com:hwtools/PranaAI.git,   dir: hw/PranaAI/main}

  # ~/books -> repos/books/<org>/<name>/<default-branch> (org-nested so the two
  # 'book' repos don't collide)
  - {url: git@github.com:mcp-at-scale/mcp-server.git,           dir: books/mcp-at-scale/mcp-server/main}
  - {url: git@github.com:mcp-at-scale/book.git,                 dir: books/mcp-at-scale/book/main}
  - {url: git@github.com:mcp-at-scale/flight-booking-agent.git, dir: books/mcp-at-scale/flight-booking-agent/main}
  - {url: git@github.com:inference-book/inference-plane.git,    dir: books/inference-book/inference-plane/main}
  - {url: git@github.com:inference-book/book.git,               dir: books/inference-book/book/main}

# Env vars that must be present on the host. megh blocks `megh up` if any is
# missing, so you catch gaps before launching. box_envs are ALSO copied into the
# box (as pod env) for the repos/services running there. Note: box_envs put those
# values on a third-party VM, list only what the box genuinely needs.
requires:
  envs:
    - RUNPOD_API_KEY
    - GH_MEGH_TOKEN
  box_envs: []
    # - OPENAI_API_KEY
    # - ANTHROPIC_API_KEY

